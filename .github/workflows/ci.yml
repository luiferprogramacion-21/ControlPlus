# Integración continua de ControlPlus.
#
# Cuándo corre (el repositorio es privado: se cuidan los minutos):
#   - push a main, pull request y ejecución manual: los cuatro trabajos.
#       backend (compilación estricta y pruebas sin base de datos), frontend,
#       backend con un PostgreSQL 18 descartable y pruebas de navegador del
#       flujo principal (e2e, base controlplus_e2e_* descartable).
#   - los push a main que solo cambian documentación (Markdown o carpetas docs)
#     no ejecutan nada. Si un push mezcla código y documentación, corre completo.
#   - una ejecución nueva cancela la anterior del mismo push o pull request.
#
# Este workflow nunca despliega, aplica migraciones a una base persistente ni usa
# secretos reales. La base `controlplus` no existe en estas máquinas: cada prueba
# crea y elimina su propia base `controlplus_test_*`.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  SOLUTION: ControlPlus.Backend.slnx

defaults:
  run:
    working-directory: backend/ControlPlus.Backend

jobs:
  backend:
    name: Backend (compilación y pruebas sin base de datos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar paquetes
        run: dotnet restore "$SOLUTION" -m:1 -p:BuildInParallel=false

      - name: Compilar (Release, en serie, advertencias como errores)
        run: dotnet build "$SOLUTION" -c Release --no-restore -m:1 -p:BuildInParallel=false -warnaserror

      - name: Pruebas de dominio
        run: dotnet test ControlPlus.Domain.Tests -c Release --no-build -m:1

      # Las pruebas que usan PostgreSQL llevan [Trait("Category", "Integration")]
      # y corren en el trabajo "database-tests".
      - name: Pruebas de API sin base de datos
        run: dotnet test ControlPlus.Api.Tests -c Release --no-build -m:1 --filter "Category!=Integration"

      - name: Pruebas de Infrastructure sin base de datos
        run: dotnet test ControlPlus.Infrastructure.Tests -c Release --no-build -m:1 --filter "Category!=Integration"

  frontend:
    name: Frontend (pruebas y build de producción)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NG_CLI_ANALYTICS: 'false'
    defaults:
      run:
        working-directory: backend/ControlPlus.Backend/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/ControlPlus.Backend/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm test -- --watch=false

      # Las advertencias de presupuesto de tamaño existentes no hacen fallar el build.
      - name: Build de producción
        run: npm run build

  database-tests:
    name: Backend con PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          # Contenedor efímero accesible solo desde esta máquina; esta contraseña no es un
          # secreto y deja de existir al terminar la corrida. No usar el método "trust":
          # varias pruebas comprueban que una contraseña incorrecta sea rechazada.
          POSTGRES_PASSWORD: ci-pg-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Las pruebas exigen PostgreSQL 18 y el rol controlplus_test_admin con CREATEDB
      # y sin SUPERUSER, conectado a la base postgres en 127.0.0.1:5432.
      - name: Crear el rol de pruebas
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: ci-pg-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test_password="$(openssl rand -hex 24)"
          echo "::add-mask::$test_password"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE controlplus_test_admin LOGIN CREATEDB NOSUPERUSER PASSWORD '${test_password}'"
          # Rol de la aplicación como en la tienda (sin inicio de sesión): las migraciones le conceden permisos y
          # las pruebas de permisos y de restauración de emergencia los comprueban.
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE controlplus_app NOLOGIN"
          echo "CONTROLPLUS_TEST_ADMIN_CONNECTION=Host=127.0.0.1;Port=5432;Database=postgres;Username=controlplus_test_admin;Password=${test_password}" >> "$GITHUB_ENV"

      - name: Restaurar paquetes
        run: dotnet restore "$SOLUTION" -m:1 -p:BuildInParallel=false

      - name: Compilar (Release, en serie, advertencias como errores)
        run: dotnet build "$SOLUTION" -c Release --no-restore -m:1 -p:BuildInParallel=false -warnaserror

      - name: Pruebas de dominio
        run: dotnet test ControlPlus.Domain.Tests -c Release --no-build -m:1 --results-directory "$RUNNER_TEMP/trx" --logger "trx;LogFileName=Domain.trx"

      - name: Pruebas de Infrastructure
        if: ${{ !cancelled() }}
        run: dotnet test ControlPlus.Infrastructure.Tests -c Release --no-build -m:1 --results-directory "$RUNNER_TEMP/trx" --logger "trx;LogFileName=Infrastructure.trx"

      - name: Pruebas de API
        if: ${{ !cancelled() }}
        run: dotnet test ControlPlus.Api.Tests -c Release --no-build -m:1 --results-directory "$RUNNER_TEMP/trx" --logger "trx;LogFileName=Api.trx"

      - name: Guardar resultados (TRX)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: resultados-trx
          path: ${{ runner.temp }}/trx
          retention-days: 7

  # Pruebas de navegador del flujo principal (docs/e2e.md): la API publicada sirve la pantalla compilada, como el
  # servicio de la tienda, contra una base descartable controlplus_e2e_* en un PostgreSQL 18 efímero.
  e2e:
    name: Pruebas de navegador (flujo principal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NG_CLI_ANALYTICS: 'false'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/ControlPlus.Backend/frontend/package-lock.json
            backend/ControlPlus.Backend/e2e/package-lock.json

      - name: Compilar la pantalla (producción)
        working-directory: backend/ControlPlus.Backend/frontend
        run: |
          npm ci
          npm run build

      - name: Publicar la API con la pantalla dentro
        run: |
          dotnet publish ControlPlus.Api/ControlPlus.Api.csproj -c Release -o "$RUNNER_TEMP/api" -m:1 -p:BuildInParallel=false -warnaserror --nologo
          mkdir -p "$RUNNER_TEMP/api/wwwroot"
          cp -r frontend/dist/controlplus-frontend/browser/. "$RUNNER_TEMP/api/wwwroot/"
          test -f "$RUNNER_TEMP/api/wwwroot/index.html"

      - name: Preparar la base descartable y las claves de la prueba
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          master_key="$(openssl rand -hex 32)"; jwt_key="$(openssl rand -hex 48)"; admin_password="$(shuf -i 1000-9999 -n 1)"  # contraseñas de 4 números, como en la tienda
          echo "::add-mask::$master_key"; echo "::add-mask::$jwt_key"; echo "::add-mask::$admin_password"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE controlplus_e2e_ci"
          connection="Host=127.0.0.1;Port=5432;Database=controlplus_e2e_ci;Username=postgres;Password=${PGPASSWORD}"
          CONTROLPLUS_E2E_CONNECTION="$connection" dotnet run e2e/setup/Prepare-E2EDatabase.cs
          {
            echo "ConnectionStrings__ControlPlusDb=$connection"
            echo "Installation__MasterKey=$master_key"
            echo "Jwt__SigningKey=$jwt_key"
            echo "CONTROLPLUS_E2E_MASTER_KEY=$master_key"
            echo "CONTROLPLUS_E2E_ADMIN_PASSWORD=$admin_password"
          } >> "$GITHUB_ENV"

      - name: Iniciar la API
        working-directory: ${{ runner.temp }}/api
        env:
          # La base y el usuario de este trabajo son descartables; activa únicamente las excepciones de pruebas.
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://127.0.0.1:5000
          # Las pruebas de navegador inician sesión muchas veces seguidas desde la misma dirección; en la tienda siguen siendo 10.
          RateLimiting__LoginPerMinute: '200'
        run: |
          nohup dotnet ControlPlus.Api.dll > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/api/health/database > /dev/null 2>&1; then echo "API lista"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Preparar la instalación con el script de arranque (dos veces)
        env:
          CONTROLPLUS_SETUP_MASTER_KEY: ${{ env.CONTROLPLUS_E2E_MASTER_KEY }}
          CONTROLPLUS_SETUP_ADMIN_PASSWORD: ${{ env.CONTROLPLUS_E2E_ADMIN_PASSWORD }}
        shell: pwsh
        run: |
          $arguments = @{
            ApiUrl = 'http://127.0.0.1:5000'; EstablishmentName = 'Tienda de pruebas E2E'; Identification = 'E2E-900000001'
            InstallationCode = 'E2E-INSTALACION'; InstallationSerial = 'E2E1'; TerminalCode = 'E2E-TERMINAL'
            TerminalName = 'Terminal de pruebas E2E'; AdminUserName = 'admin.e2e'; AdminDisplayName = 'Administrador E2E'
            CashRegisterCode = 'E2E-CAJA'; CashRegisterName = 'Caja de pruebas E2E'
          }
          foreach ($run in 1, 2) {
            $output = & ./scripts/setup/Initialize-ControlPlus.ps1 @arguments 6>&1 | Out-String
            Write-Host $output
            if ($output -notmatch 'CONTROLPLUS_INITIAL_SETUP_OK') { throw "La ejecución $run del script no terminó bien." }
            if ($run -eq 2 -and $output -notmatch 'ya tenía Administrador') { throw 'La segunda ejecución no reconoció la instalación existente.' }
          }

      - name: Instalar Playwright y Chromium
        working-directory: backend/ControlPlus.Backend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Pruebas de navegador
        working-directory: backend/ControlPlus.Backend/e2e
        run: npx playwright test

      - name: Guardar evidencia (informe, trazas y registro de la API)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidencia
          path: |
            backend/ControlPlus.Backend/e2e/playwright-report
            backend/ControlPlus.Backend/e2e/test-results
            ${{ runner.temp }}/api.log
          retention-days: 7
